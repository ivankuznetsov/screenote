# Each Screenshot with an image has one ScreenshotImage(viewport: :desktop).
# `alice_screenshot_pending` has no image and therefore no ScreenshotImage —
# readers treat `screenshot_images.empty?` as "no image yet".
alice_screenshot_desktop:
  screenshot: alice_screenshot
  viewport: 0
  status: 1
  width: 1920
  height: 1080

bob_screenshot_desktop:
  screenshot: bob_screenshot
  viewport: 0
  status: 1
  width: 1440
  height: 900
