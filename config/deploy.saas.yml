# Hosted screenote.ai deployment only. Self-hosted operators deploy with ONCE;
# see docs/once-deployment.md.

service: screenote
image: screenote

servers:
  web:
    - screenote

proxy:
  ssl: true
  host: screenote.ai

registry:
  server: localhost:5555

env:
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL
    - RABATA_ACCESS_KEY_ID
    - RABATA_SECRET_ACCESS_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
    - HONEYBADGER_API_KEY
    - HONEYBADGER_JS_API_KEY
    - RESEND_API_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - STRIPE_PRO_PRICE_ID
    - SCREENOTE_SAAS_OPERATOR_EMAIL
  clear:
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 3
    WEB_CONCURRENCY: 2
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true
    SCREENOTE_EDITION: saas
    SCREENOTE_BASE_URL: https://screenote.ai
    SCREENOTE_FORWARDED_CLIENT_HOPS: 2
    SCREENOTE_FORWARDED_PROXY_HOST: kamal-proxy
    THRUSTER_FORWARD_HEADERS: true
    SCREENOTE_TRUSTED_PROXIES: 127.0.0.1/32,::1/128
    MAILER_FROM: noreply@screenote.ai
    RABATA_ENDPOINT: https://s3.us-east-1.rabata.io
    RABATA_REGION: us-east-1
    RABATA_BUCKET: screenote

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  migrate: app exec --reuse "bin/rails db:migrate"
  seed: app exec --reuse "bin/rails db:seed"

asset_path: /rails/public/assets
hooks_path: .kamal/hooks/saas

# Bound database preparation and startup job enqueue before Thruster serves.
deploy_timeout: 900

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16-alpine
    host: screenote
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: screenote
        POSTGRES_DB: screenote_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/lib/screenote/postgresql:/var/lib/postgresql/data
    cmd: postgres -c shared_buffers=256MB -c max_connections=200
