default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: <%= ENV["SCREENOTE_EDITION"] == "self_hosted" ? ENV.fetch("RAILS_MAX_THREADS", 3) : 3 %>
      processes: <%= ENV["SCREENOTE_EDITION"] == "self_hosted" ? 1 : ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
