# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  clear_expired_oauth_device_grants:
    command: "OauthDeviceGrant.cleanup_expired!"
    schedule: every 15 minutes

  clear_unused_dynamic_oauth_clients:
    command: "Oauth::DynamicClientRegistration.cleanup_unused!"
    schedule: every hour at minute 27

  reconcile_screenshot_processing:
    class: ReconcileScreenshotProcessingJob
    schedule: every 5 minutes

  # Abandoned composer drafts expire 24 hours after their last activity. A
  # quarter-hour sweep keeps the reclaim window short without scanning hot.
  clear_expired_image_attachment_drafts:
    class: ImageAttachmentDraftCleanupJob
    schedule: every 15 minutes

  reconcile_image_attachments:
    class: ImageAttachmentOrphanReconciliationJob
    schedule: every hour at minute 41

<% if Screenote::Deployment.current.mail? %>
  send_digest_notifications:
    class: SendDigestNotificationsJob
    schedule: every hour at minute 0
<% end %>
