# Name of your application. Used to uniquely configure containers.
service: screenote

# Name of the container image (used with local registry on localhost:5555)
image: screenote

# Deploy to these servers.
servers:
  web:
    - screenote

# Enable SSL via Let's Encrypt on kamal-proxy (origin). Cloudflare terminates SSL at the edge (Full mode).
proxy:
  ssl: true
  host: screenote.ai

# Local Docker registry (Kamal will automatically start it)
registry:
  server: localhost:5555

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - DATABASE_PASSWORD
    - POSTGRES_PASSWORD
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL
    - RABATA_ACCESS_KEY_ID
    - RABATA_SECRET_ACCESS_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
    - HONEYBADGER_API_KEY
    - HONEYBADGER_JS_API_KEY
    - RESEND_API_KEY
  clear:
    # Run Solid Queue Supervisor inside Puma for single-server deployment
    SOLID_QUEUE_IN_PUMA: true

    # Number of Solid Queue worker threads
    JOB_CONCURRENCY: 3

    # Number of Puma worker processes
    WEB_CONCURRENCY: 2

    # Rails environment
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true

    # Domain configuration
    APP_HOST: screenote.ai

    # S3 configuration (Rabata.io)
    RABATA_ENDPOINT: https://s3.us-east-1.rabata.io
    RABATA_REGION: us-east-1
    RABATA_BUCKET: screenote

# Aliases for common commands
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  migrate: app exec --reuse "bin/rails db:migrate"
  seed: app exec --reuse "bin/rails db:seed"

# Bridge fingerprinted assets between versions
asset_path: /rails/public/assets

# Configure the image builder
builder:
  arch: amd64

# Accessories - PostgreSQL
accessories:
  db:
    image: postgres:16-alpine
    host: screenote
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: screenote
        POSTGRES_DB: screenote_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/lib/screenote/postgresql:/var/lib/postgresql/data
    cmd: postgres -c shared_buffers=256MB -c max_connections=200
