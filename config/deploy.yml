# Screenote self-hosted starter configuration.
#
# Set servers.web to the Linux AMD64 server Kamal reaches over SSH. Set
# proxy.host and SCREENOTE_BASE_URL to the public Screenote hostname, then copy
# .kamal/secrets.example to .kamal/secrets and fill in its values. On a
# supported tag, bin/kamal mirrors the exact qualified release image into this
# loopback registry before asking Kamal to pull it.

service: screenote
image: screenote

servers:
  web:
    - screenote.example.com

ssh:
  user: root

proxy:
  ssl: true
  host: screenote.example.com
  app_port: 80
  # This is the internet/VPN edge. Discard caller-supplied X-Forwarded-*
  # values and let Kamal Proxy generate authoritative forwarding headers.
  forward_headers: false
  healthcheck:
    path: /ready
    interval: 3
    timeout: 5
  buffering:
    requests: true
    responses: true
    max_request_body: 31_457_280

registry:
  server: localhost:5555

env:
  secret:
    - SECRET_KEY_BASE
    - SCREENOTE_BOOTSTRAP_TOKEN
    # Uncomment the secrets needed by the optional providers below.
    # - SMTP_USERNAME
    # - SMTP_PASSWORD
    # - SCREENOTE_S3_ACCESS_KEY_ID
    # - SCREENOTE_S3_SECRET_ACCESS_KEY
    # - GOOGLE_CLIENT_SECRET
    # - GITHUB_CLIENT_SECRET
    # - HONEYBADGER_API_KEY
  clear:
    SCREENOTE_EDITION: self_hosted
    SCREENOTE_BASE_URL: https://screenote.example.com

    # Kamal Proxy sanitizes forwarding headers at the edge. Thruster is the
    # private in-container hop to Rails and must pass those generated values.
    # Neither port 80 nor Rails' target port is published directly.
    THRUSTER_FORWARD_HEADERS: true
    SCREENOTE_TRUSTED_PROXIES: 127.0.0.1/32,::1/128,172.16.0.0/12

    SCREENOTE_STORAGE: local
    SCREENOTE_SMTP_ENABLED: false
    SCREENOTE_GOOGLE_OAUTH_ENABLED: false
    SCREENOTE_GITHUB_OAUTH_ENABLED: false
    SCREENOTE_HONEYBADGER_ENABLED: false

    # External transactional email (Resend example). Set
    # SCREENOTE_SMTP_ENABLED to true and uncomment both SMTP secrets above.
    # SMTP_ADDRESS: smtp.resend.com
    # SMTP_PORT: 587
    # SMTP_AUTHENTICATION: plain
    # SMTP_STARTTLS: true
    # MAILER_FROM: Screenote <screenote@example.com>

    # To store screenshots in S3-compatible object storage, set
    # SCREENOTE_STORAGE to s3, uncomment both S3 secrets above, and fill these.
    # SCREENOTE_S3_ENDPOINT: https://objects.example.com
    # SCREENOTE_S3_REGION: us-east-1
    # SCREENOTE_S3_BUCKET: screenote-private
    # SCREENOTE_S3_PREFIX: production
    # SCREENOTE_S3_PATH_STYLE: true

    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 3
    WEB_CONCURRENCY: 1
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true
    RAILS_LOG_LEVEL: info
    RAILS_MAX_THREADS: 3

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  diagnostics: app exec --reuse "bin/rails runner script/self_hosted_diagnostics"

# Bridge fingerprinted assets between old and new containers during a deploy.
asset_path: /rails/public/assets

volumes:
  - screenote_storage:/rails/storage

minimum_version: 2.10.1
deploy_timeout: 120
drain_timeout: 30

builder:
  arch: amd64
