services:
  screenote:
    environment:
      SCREENOTE_BOOTSTRAP_TOKEN_FILE: /run/secrets/screenote_bootstrap_token
    secrets:
      - source: screenote_bootstrap_token
        target: screenote_bootstrap_token
        uid: "1000"
        gid: "1000"
        mode: 0400

secrets:
  screenote_bootstrap_token:
    file: ${SCREENOTE_BOOTSTRAP_TOKEN_PATH:?Set SCREENOTE_BOOTSTRAP_TOKEN_PATH to the restricted bootstrap-token file}
