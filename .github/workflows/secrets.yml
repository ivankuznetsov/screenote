name: Secrets

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  repository-incidents:
    name: GitGuardian repository incidents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      EXPECTED_REPOSITORY: ${{ github.repository }}
      GITHUB_STATUS_TOKEN: ${{ github.token }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_INCIDENTS_API_KEY }}
      GITGUARDIAN_API_URL: ${{ vars.GITGUARDIAN_API_URL }}
      GITGUARDIAN_SOURCE_ID: ${{ secrets.GITGUARDIAN_SOURCE_ID }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      # This job intentionally has no checkout, cache, artifact, environment, or
      # third-party Action. pull_request_target is safe here only because no PR
      # field or repository byte is executed. The GitGuardian token reaches only
      # its fixed API, and the GitHub token can write only the named commit status.
      - name: Fail closed on every repository incident page
        shell: ruby {0}
        run: |
          require "json"
          require "net/http"
          require "uri"

          class GateFailure < StandardError; end

          class FixtureTransport
            Response = Struct.new(:code, :body, :headers) do
              def [](name)
                headers[name.to_s.downcase]
              end
            end

            def initialize(path)
              payload = JSON.parse(File.binread(path), create_additions: false)
              records = payload.is_a?(Hash) ? payload["responses"] : nil
              raise GateFailure, "GitGuardian test fixture has an unexpected shape" unless records.is_a?(Array)

              @responses = records.map do |record|
                raise GateFailure, "GitGuardian test fixture has an unexpected response" unless record.is_a?(Hash)
                unknown = record.keys - %w[url status headers body]
                missing = %w[url status headers body] - record.keys
                raise GateFailure, "GitGuardian test fixture has unexpected fields" if unknown.any? || missing.any?
                record
              end
            rescue Errno::ENOENT, JSON::ParserError
              raise GateFailure, "GitGuardian test fixture could not be loaded"
            end

            def request(uri)
              record = @responses.shift
              raise GateFailure, "GitGuardian test fixture was exhausted" unless record
              raise GateFailure, "GitGuardian test fixture request order differed" unless record["url"] == uri.to_s
              raise GateFailure, "GitGuardian test fixture status is invalid" unless record["status"].is_a?(Integer)
              raise GateFailure, "GitGuardian test fixture headers are invalid" unless record["headers"].is_a?(Hash)
              raise GateFailure, "GitGuardian test fixture body is invalid" unless record["body"].is_a?(String)

              headers = record["headers"].to_h { |key, value| [key.to_s.downcase, value.to_s] }
              Response.new(record["status"].to_s, record["body"], headers)
            end

            def finish!
              raise GateFailure, "GitGuardian test fixture contained unused responses" unless @responses.empty?
            end
          end

          def required_env(name)
            value = ENV[name].to_s.strip
            raise GateFailure, "#{name} is not configured" if value.empty?
            value
          end

          def parse_json(response, expected_type)
            raise GateFailure, "GitGuardian response exceeded 2 MiB" if response.body.bytesize > 2 * 1024 * 1024
            value = JSON.parse(response.body)
            raise GateFailure, "GitGuardian returned an unexpected JSON shape" unless value.is_a?(expected_type)
            value
          rescue JSON::ParserError
            raise GateFailure, "GitGuardian returned malformed JSON"
          end

          def request(uri, token, fixture_transport)
            response = if fixture_transport
              fixture_transport.request(uri)
            else
              request = Net::HTTP::Get.new(uri)
              request["Accept"] = "application/json"
              request["Authorization"] = "Token #{token}"
              request["User-Agent"] = "screenote-gitguardian-incident-gate/1"

              Net::HTTP.start(
                uri.host,
                uri.port,
                use_ssl: true,
                open_timeout: 10,
                read_timeout: 30
              ) { |http| http.request(request) }
            end

            status = Integer(response.code, 10)
            raise GateFailure, "GitGuardian request failed with HTTP #{status}" unless (200..299).cover?(status)
            response
          rescue GateFailure
            raise
          rescue StandardError => error
            raise GateFailure, "GitGuardian request failed (#{error.class})"
          end

          def pagination_next(response, base_uri, expected_path)
            header = response["link"].to_s.strip
            return nil if header.empty?

            links = header.split(",").map(&:strip).map do |entry|
              match = entry.match(/\A<([^>]+)>;\s*rel="([a-z]+)"\z/)
              raise GateFailure, "GitGuardian returned a malformed pagination link" unless match
              [match[2], URI.parse(match[1])]
            rescue URI::InvalidURIError
              raise GateFailure, "GitGuardian returned an invalid pagination URI"
            end

            next_links = links.select { |rel, _uri| rel == "next" }
            raise GateFailure, "GitGuardian returned duplicate next links" if next_links.length > 1
            return nil if next_links.empty?

            uri = next_links.first.last
            same_origin = uri.scheme == "https" && uri.host == base_uri.host && uri.port == base_uri.port
            safe_target = same_origin && uri.userinfo.nil? && uri.fragment.nil? && uri.path == expected_path
            query_pairs = URI.decode_www_form(uri.query.to_s)
            query = query_pairs.to_h
            cursor = query["cursor"].to_s
            safe_query = query_pairs.length == 2 && query_pairs.map(&:first).sort == %w[cursor per_page] &&
              query["per_page"] == "100" && cursor.bytesize.between?(1, 2_048) &&
              cursor.match?(/\A[A-Za-z0-9._~+\/=\-]+\z/)
            raise GateFailure, "GitGuardian returned an unsafe pagination target" unless safe_target && safe_query
            uri
          end

          def publish_commit_status(repository, sha, token, state:, description:)
            return if sha.empty?

            raise GateFailure, "pull request commit SHA is invalid" unless sha.match?(/\A[0-9a-f]{40}\z/)
            raise GateFailure, "repository identity is invalid" unless repository.match?(/\A[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\z/)
            raise GateFailure, "GITHUB_STATUS_TOKEN is not configured" if token.empty?
            raise GateFailure, "GitHub status state is invalid" unless %w[pending success error].include?(state)

            uri = URI("https://api.github.com/repos/#{repository}/statuses/#{sha}")
            request = Net::HTTP::Post.new(uri)
            request["Accept"] = "application/vnd.github+json"
            request["Authorization"] = "Bearer #{token}"
            request["User-Agent"] = "screenote-gitguardian-incident-gate/1"
            request["X-GitHub-Api-Version"] = "2022-11-28"
            request.body = JSON.generate(
              state:,
              context: "Secrets / GitGuardian repository incidents",
              description:
            )
            response = Net::HTTP.start(
              uri.host,
              uri.port,
              use_ssl: true,
              open_timeout: 10,
              read_timeout: 30
            ) { |http| http.request(request) }
            status = Integer(response.code, 10)
            raise GateFailure, "GitHub status publication failed with HTTP #{status}" unless status == 201
          rescue GateFailure
            raise
          rescue StandardError => error
            raise GateFailure, "GitHub status publication failed (#{error.class})"
          end

          def publish_error_statuses(repository, shas, token)
            shas.each do |sha|
              publish_commit_status(
                repository,
                sha,
                token,
                state: "error",
                description: "Repository incident gate failed closed"
              )
            end
          rescue GateFailure
            warn "GitGuardian repository incident gate could not publish its error status"
          end

          fixture_transport = nil
          repository = ""
          status_shas = []
          status_token = ""
          begin
            fixture_transport = if ENV["SCREENOTE_GITGUARDIAN_FIXTURE_TEST"] == "1"
              raise GateFailure, "GitGuardian test fixture path is required" unless ARGV.length == 1
              FixtureTransport.new(ARGV.fetch(0))
            else
              raise GateFailure, "unexpected GitGuardian gate arguments" unless ARGV.empty?
              nil
            end
            repository = required_env("EXPECTED_REPOSITORY")
            unless fixture_transport
              status_token = required_env("GITHUB_STATUS_TOKEN")
              status_shas = [ ENV["PR_HEAD_SHA"].to_s.strip, ENV["PR_MERGE_SHA"].to_s.strip ].reject(&:empty?).uniq
              status_shas.each do |sha|
                publish_commit_status(
                  repository,
                  sha,
                  status_token,
                  state: "pending",
                  description: "Checking every GitGuardian repository incident page"
                )
              end
            end

            token = required_env("GITGUARDIAN_API_KEY")
            source_id = required_env("GITGUARDIAN_SOURCE_ID")
            raise GateFailure, "GITGUARDIAN_SOURCE_ID is invalid" unless source_id.match?(/\A[1-9][0-9]*\z/)

            configured_url = ENV["GITGUARDIAN_API_URL"].to_s.strip
            configured_url = "https://api.gitguardian.com" if configured_url.empty?
            base_uri = URI.parse(configured_url)
            allowed_origins = ["https://api.gitguardian.com", "https://api.eu1.gitguardian.com"]
            origin = "#{base_uri.scheme}://#{base_uri.host}#{base_uri.port == 443 ? "" : ":#{base_uri.port}"}"
            raise GateFailure, "GITGUARDIAN_API_URL is not an approved API origin" unless allowed_origins.include?(origin)
            raise GateFailure, "GITGUARDIAN_API_URL must not contain a path, query, fragment, or userinfo" unless
              ["", "/"].include?(base_uri.path) && base_uri.query.nil? && base_uri.fragment.nil? && base_uri.userinfo.nil?

            source_uri = URI.join("#{origin}/", "v1/sources/#{source_id}")
            source = parse_json(request(source_uri, token, fixture_transport), Hash)
            valid_source = source["id"].to_s == source_id &&
              source["type"] == "github" &&
              source["full_name"].to_s.casecmp?(repository)
            raise GateFailure, "GitGuardian source does not match this GitHub repository" unless valid_source
            raise GateFailure, "GitGuardian source monitoring is not active" unless source["monitoring_status"] == "active"
            provider_metadata = source["provider_metadata"]
            raise GateFailure, "GitGuardian source provider metadata is malformed" unless provider_metadata.is_a?(Hash)
            unless provider_metadata["archived"] == false && provider_metadata["deleted"] == false
              raise GateFailure, "GitGuardian source archived or deleted state is not explicitly false"
            end

            path = "/v1/sources/#{source_id}/incidents/secrets"
            uri = URI("#{origin}#{path}?per_page=100")
            pages = 0
            incident_count = 0
            open_count = 0
            seen_urls = {}
            seen_incidents = {}
            allowed_statuses = %w[IGNORED TRIGGERED ASSIGNED RESOLVED]

            while uri
              raise GateFailure, "GitGuardian pagination loop detected" if seen_urls[uri.to_s]
              raise GateFailure, "GitGuardian pagination exceeded 1,000 pages" if pages >= 1_000
              seen_urls[uri.to_s] = true

              response = request(uri, token, fixture_transport)
              incidents = parse_json(response, Array)
              incidents.each do |incident|
                raise GateFailure, "GitGuardian returned a malformed incident" unless incident.is_a?(Hash)
                id = incident["id"]
                status = incident["status"]
                raise GateFailure, "GitGuardian returned an invalid incident identifier" unless id.is_a?(Integer) && id.positive?
                raise GateFailure, "GitGuardian returned an unknown incident status" unless allowed_statuses.include?(status)
                raise GateFailure, "GitGuardian returned a duplicate incident" if seen_incidents[id]
                seen_incidents[id] = true
                incident_count += 1
                open_count += 1 if %w[TRIGGERED ASSIGNED].include?(status)
              end

              pages += 1
              uri = pagination_next(response, base_uri, path)
            end

            fixture_transport&.finish!
            raise GateFailure, "GitGuardian has #{open_count} open repository incident(s)" unless open_count.zero?
            unless fixture_transport
              status_shas.each do |sha|
                publish_commit_status(
                  repository,
                  sha,
                  status_token,
                  state: "success",
                  description: "Repository source active; every incident page closed"
                )
              end
            end
            puts "GitGuardian repository incident gate passed: #{incident_count} incident(s), #{pages} page(s), 0 open"
          rescue GateFailure => error
            publish_error_statuses(repository, status_shas, status_token) unless fixture_transport
            warn "GitGuardian repository incident gate failed: #{error.message}"
            exit 1
          rescue StandardError => error
            publish_error_statuses(repository, status_shas, status_token) unless fixture_transport
            warn "GitGuardian repository incident gate failed closed (#{error.class})"
            exit 1
          end
