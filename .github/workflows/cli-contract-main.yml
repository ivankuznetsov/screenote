name: Public CLI main contract

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-contract-main:
    name: public-cli-main
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout service
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout public CLI main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ivankuznetsov/screenote-cli
          ref: main
          path: tmp/screenote-cli
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 (2026-07-22)
        with:
          bundler-cache: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache-dependency-path: tmp/screenote-cli/go.sum

      - name: Run public CLI digest contract
        env:
          RAILS_ENV: test
          SCREENOTE_CLI_CONTRACT_PATH: ${{ github.workspace }}/tmp/screenote-cli/testdata/contracts/snapshot-digests-v1.json
        run: |
          test -s "$SCREENOTE_CLI_CONTRACT_PATH"
          bin/rails db:test:prepare
          PARALLEL_WORKERS=1 bin/rails test test/integration/public_cli_digest_contract_test.rb

      - name: Test public CLI main
        working-directory: tmp/screenote-cli
        run: go test ./...

      - name: Record release applicability
        run: echo "::notice::This scheduled main-branch drift check is not release evidence; releases use an exact semantic CLI tag."
