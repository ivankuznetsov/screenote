<!doctype html>
<html lang="en">
  <head>
    <title>Change rejected — Screenote</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1f2937;
        background: #f9fafb;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .error-page {
        text-align: center;
        padding: 2rem;
        max-width: 480px;
      }

      .error-page__logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 2rem;
      }

      .error-page__code {
        font-size: 6rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #d1d5db;
        margin-bottom: 0.5rem;
      }

      .error-page__title {
        font-size: 1.25rem;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 0.5rem;
      }

      .error-page__message {
        font-size: 0.938rem;
        color: #6b7280;
        margin-bottom: 2rem;
      }

      .error-page__link {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 6px;
        text-decoration: none;
      }

      .error-page__link:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <svg class="error-page__logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="logo-pin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0b92e"/>
            <stop offset="100%" stop-color="#d4901a"/>
          </linearGradient>
          <clipPath id="logo-bounds">
            <rect width="512" height="512" rx="108"/>
          </clipPath>
        </defs>
        <rect width="512" height="512" rx="108" fill="#0a0a0f"/>
        <g clip-path="url(#logo-bounds)">
          <g opacity="0.12" stroke="#e5a31e" stroke-width="1">
            <line x1="171" y1="0" x2="171" y2="512"/>
            <line x1="256" y1="0" x2="256" y2="512"/>
            <line x1="341" y1="0" x2="341" y2="512"/>
            <line x1="0" y1="171" x2="512" y2="171"/>
            <line x1="0" y1="256" x2="512" y2="256"/>
            <line x1="0" y1="341" x2="512" y2="341"/>
          </g>
          <rect x="164" y="188" width="236" height="192" rx="8"
                fill="rgba(229,163,30,0.06)" stroke="#e5a31e" stroke-width="8"/>
          <circle cx="164" cy="188" r="88" fill="rgba(229,163,30,0.08)"/>
          <circle cx="164" cy="188" r="64" fill="url(#logo-pin)"/>
        </g>
      </svg>
      <div class="error-page__code">422</div>
      <h1 class="error-page__title">Change rejected</h1>
      <p class="error-page__message">Maybe you tried to change something you didn't have access to.</p>
      <a href="/" class="error-page__link">Go back to Screenote</a>
    </div>
  </body>
</html>
