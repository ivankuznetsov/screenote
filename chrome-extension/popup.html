<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1f2937;
      background: #ffffff;
      width: 340px;
      min-height: 100px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #d1d5db;
    }

    .header__title {
      font-size: 0.9375rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .header__logo {
      width: 1.25rem;
      height: 1.25rem;
    }

    .header__email {
      font-size: 0.75rem;
      color: #6b7280;
    }

    /* ── Content ── */
    .content {
      padding: 1rem;
    }

    /* ── Auth screen ── */
    .auth {
      text-align: center;
      padding: 2rem 1rem;
    }

    .auth__title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
    }

    .auth__desc {
      font-size: 0.8125rem;
      color: #6b7280;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      line-height: 1.5;
      font-family: inherit;
      width: 100%;
    }

    .btn--primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn--primary:hover {
      background: #1d4ed8;
    }

    .btn--primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn--secondary {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    .btn--secondary:hover {
      background: #f9fafb;
    }

    .btn--danger {
      background: #ffffff;
      color: #dc2626;
      border: 1px solid #d1d5db;
      font-size: 0.8125rem;
      padding: 0.375rem 0.75rem;
    }

    .btn--danger:hover {
      background: #fef2f2;
    }

    .btn--small {
      padding: 0.375rem 0.75rem;
      font-size: 0.8125rem;
    }

    /* ── Project selector ── */
    .section {
      margin-bottom: 1rem;
    }

    .section__label {
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: #374151;
    }

    .select {
      display: block;
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2937;
      font-family: inherit;
    }

    .select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .input {
      display: block;
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2937;
      font-family: inherit;
    }

    .input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    /* ── New project form ── */
    .new-project {
      display: none;
      margin-top: 0.5rem;
    }

    .new-project--visible {
      display: flex;
      gap: 0.375rem;
    }

    .new-project .input {
      flex: 1;
    }

    /* ── Status messages ── */
    .status {
      font-size: 0.8125rem;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      display: none;
    }

    .status--visible {
      display: block;
    }

    .status--error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .status--success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .status--info {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    /* ── Footer ── */
    .footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer__link {
      font-size: 0.75rem;
      color: #6b7280;
      text-decoration: none;
    }

    .footer__link:hover {
      color: #2563eb;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 2rem;
      color: #6b7280;
      font-size: 0.875rem;
    }

    /* ── URL match indicator ── */
    .url-match {
      font-size: 0.75rem;
      color: #16a34a;
      margin-top: 0.25rem;
      display: none;
    }

    .url-match--visible {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Loading state -->
  <div id="loading" class="loading">Loading...</div>

  <!-- Auth screen (not signed in) -->
  <div id="auth-screen" style="display: none;">
    <div class="auth">
      <div class="auth__title">Welcome to Screenote</div>
      <div class="auth__desc">
        Sign in with your Screenote account to capture screenshots and add annotations directly on any website.
      </div>
      <button id="login-btn" class="btn btn--primary">Sign in to Screenote</button>
    </div>
  </div>

  <!-- Main screen (signed in) -->
  <div id="main-screen" style="display: none;">
    <div class="header">
      <div class="header__title">
        <svg class="header__logo" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        Screenote
      </div>
      <span id="user-email" class="header__email"></span>
    </div>

    <div class="content">
      <div id="status" class="status"></div>

      <div class="section">
        <label class="section__label">Project</label>
        <select id="project-select" class="select">
          <option value="">Select a project...</option>
        </select>
        <div id="url-match" class="url-match"></div>

        <div id="new-project-toggle" style="margin-top: 0.375rem;">
          <button id="show-new-project" class="btn btn--secondary btn--small" style="width: auto;">+ New project</button>
        </div>

        <div id="new-project-form" class="new-project">
          <input id="new-project-name" class="input" type="text" placeholder="Project name">
          <button id="create-project-btn" class="btn btn--primary btn--small" style="width: auto; white-space: nowrap;">Create</button>
        </div>
      </div>

      <button id="capture-btn" class="btn btn--primary" disabled>
        Capture &amp; Annotate
      </button>
    </div>

    <div class="footer">
      <button id="logout-btn" class="btn--danger btn--small btn">Sign out</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
